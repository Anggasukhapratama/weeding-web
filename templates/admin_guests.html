{% extends "base.html" %}
{% block title %}Kelola Tamu{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Daftar Tamu</h3>
  <div>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-sm btn-outline-secondary">Dashboard</a>
    <a href="{{ url_for('admin_checkin') }}" class="btn btn-sm btn-outline-success">Check-in</a>
  </div>
</div>

<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">Tambah Tamu</h5>
    <form method="post">
      <div class="row">
        <div class="col-md-4 mb-2">
          <label class="form-label">Nama</label>
          <input type="text" class="form-control" name="name" required />
        </div>
        <div class="col-md-3 mb-2">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" name="phone" />
        </div>
        <div class="col-md-3 mb-2">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" name="email" />
        </div>
        <div class="col-md-2 mb-2">
          <label class="form-label">Nama di Undangan</label>
          <input type="text" class="form-control" name="invitation_name" />
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-2">Simpan</button>
    </form>
  </div>
</div>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Nama</th>
      <th>Code</th>
      <th>RSVP</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {% for g in guests %}
    <tr>
      <td>{{ g.name }}</td>
      <td>{{ g.code }}</td>
      <td>{{ g.rsvp_status }}</td>
      <td>
        <a href="{{ url_for('admin_guest_detail', guest_id=g.id) }}" class="btn btn-sm btn-outline-primary">Detail</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
